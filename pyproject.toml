[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ssh-mcp-server"
version = "0.1.0a1"
description = "Give MCP clients a real SSH terminal, without local SSH credentials."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "SSH MCP contributors"}]
keywords = ["mcp", "ssh", "sftp", "terminal", "ai"]
dependencies = [
  "asyncssh>=2.22,<3",
  "mcp>=1.26,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1", "pip-audit>=2.9,<3", "build>=1.2,<2"]

[project.scripts]
ssh-mcp = "ssh_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
