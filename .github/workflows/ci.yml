name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked --extra dev --group build
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m compileall -q src tests
      - run: uv run --no-sync python -m unittest discover -s tests -v
        env:
          SSH_MCP_REQUIRE_INTEGRATION: "1"
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync python scripts/check_wheel.py
      - run: uv run --no-sync pip-audit
      - name: 记录构建环境和依赖
        run: |
          mkdir -p build-record
          python --version > build-record/python.txt
          uv --version > build-record/uv.txt
          uv pip freeze > build-record/dependencies.txt
          sha256sum uv.lock package-lock.json dist/* > build-record/sha256.txt
          git rev-parse HEAD > build-record/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python }}-build
          path: |
            build-record/
            dist/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ssh-mcp:ci .
      - run: docker run --rm ssh-mcp:ci --version
      - run: docker image inspect ssh-mcp:ci --format '{{json .}}'
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --version && npm --version
      - run: npm ci
      - run: npm audit
      - run: npm run test:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: test-results/
