# 独立替代 compose.yaml，不要组合使用两个文件。
# 供主机级 HTTPS 代理使用，启动前确认选定回环端口空闲。
services:
  ssh-mcp:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ssh_mcp_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    ports:
      - "127.0.0.1:${SSH_MCP_LOCAL_PORT:-18080}:8000"

volumes:
  ssh_mcp_data:
